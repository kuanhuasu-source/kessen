# 每次推到 main 就建置單一 HTML 並部署到 GitHub Pages（Settings → Pages → Source 選 GitHub Actions）
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        with:
          enablement: true  # 第一次執行時自動啟用 Pages（來源：GitHub Actions）
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build:single
      - name: 整理 Pages 內容
        run: |
          mkdir -p site
          cp dist/kessen-m1.html site/index.html
          cp dist/kessen-m1.html site/kessen.html
          if [ -d dist/music ]; then cp -r dist/music site/music; fi  # 配樂（public/music/*.mp3）
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
